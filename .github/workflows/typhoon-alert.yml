
name: Typhoon Alert

on:
  workflow_dispatch:
  schedule:
    # 每週四台灣時間 21:00（UTC 13:00）
    - cron: "0 13 * * 4"

permissions:
  contents: read

jobs:
  typhoon-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test CWA data parsing
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python -u typhoon_alert.py

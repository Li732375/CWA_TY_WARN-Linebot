name: Typhoon Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 4"
      timezone: Asia/Taipei

permissions:
  contents: write

jobs:
  typhoon-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python and secrets
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python --version
          python - <<'PY'
          import os
          names = [
              "CWA_API_KEY",
              "LINE_CHANNEL_ACCESS_TOKEN",
              "LINE_USER_ID",
          ]
          for name in names:
              print(f"{name}: {'configured' if os.getenv(name) else 'MISSING'}")
          if any(not os.getenv(name) for name in names):
              raise SystemExit("One or more required secrets are missing.")
          PY

      - name: Test workflow update token
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.error

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"Token validation HTTP status: {response.status}")
          except urllib.error.HTTPError as error:
              print(f"Token validation failed: HTTP {error.code}")
              raise SystemExit(1)
          PY

      - name: Test repository write permission
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          path = "data/token-write-test.txt"
          url = f"https://api.github.com/repos/{repo}/contents/{path}"

          body = {
              "message": "Test workflow updater token",
              "content": base64.b64encode(
                  b"Temporary token permission test.\n"
              ).decode("ascii"),
              "branch": "main",
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(body).encode("utf-8"),
              method="PUT",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"Write test HTTP status: {response.status}")
          except urllib.error.HTTPError as error:
              print(f"Write test failed: HTTP {error.code}")
              raise SystemExit(1)
          PY

      - name: Test workflow file write permission
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          path = ".github/workflows/token-permission-test.yml"

          content = (
              "name: Temporary Token Permission Test\n"
              "on:\n"
              "  workflow_dispatch:\n"
              "jobs:\n"
              "  test:\n"
              "    runs-on: ubuntu-latest\n"
              "    steps:\n"
              "      - run: echo Permission test only\n"
          )

          url = f"https://api.github.com/repos/{repo}/contents/{path}"
          body = {
              "message": "Test workflow file write permission",
              "content": base64.b64encode(
                  content.encode("utf-8")
              ).decode("ascii"),
              "branch": "main",
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(body).encode("utf-8"),
              method="PUT",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"Workflow file write HTTP status: {response.status}")
          except urllib.error.HTTPError as error:
              print(f"Workflow file write failed: HTTP {error.code}")
              raise SystemExit(1)
          PY
